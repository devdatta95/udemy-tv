plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def keystoreFile = file('release.jks')

android {
    namespace 'dev.udemytv'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.udemytv'
        minSdk 22          // Fire OS 5+; your stick runs Fire OS 7 (API 28)
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv('KS_PASS')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Same key on every build => updates install over the old version.
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
